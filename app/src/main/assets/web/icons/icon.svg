<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#080B18"/>
      <stop offset="0.45" stop-color="#15182E"/>
      <stop offset="0.78" stop-color="#3A2A4D"/>
      <stop offset="1" stop-color="#6B3E5A"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF1C9"/>
      <stop offset="0.45" stop-color="#FFC56F"/>
      <stop offset="0.8" stop-color="#FF8A5B"/>
      <stop offset="1" stop-color="#FF7E5F"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC56F" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFC56F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFB454" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFC56F" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFB454" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="aboveHorizon"><rect x="0" y="0" width="512" height="318"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- ambient dawn glow -->
  <circle cx="256" cy="318" r="230" fill="url(#glow)"/>

  <!-- faint 8-point Islamic star (Rub el Hizb) framing the dawn -->
  <g stroke="#FFD9A0" stroke-width="3" fill="none" opacity="0.22">
    <rect x="146" y="146" width="220" height="220"/>
    <rect x="146" y="146" width="220" height="220" transform="rotate(45 256 256)"/>
  </g>

  <!-- rising sun rays -->
  <g stroke="url(#horizon)" stroke-width="7" stroke-linecap="round" opacity="0.9">
    <line x1="256" y1="120" x2="256" y2="170"/>
    <line x1="160" y1="150" x2="186" y2="192"/>
    <line x1="352" y1="150" x2="326" y2="192"/>
    <line x1="96"  y1="232" x2="146" y2="252"/>
    <line x1="416" y1="232" x2="366" y2="252"/>
  </g>

  <!-- the rising sun (clipped to a half-disc above the horizon) -->
  <g clip-path="url(#aboveHorizon)">
    <circle cx="256" cy="318" r="96" fill="url(#sun)"/>
  </g>

  <!-- horizon line -->
  <rect x="64" y="315" width="384" height="6" rx="3" fill="url(#horizon)"/>
</svg>
