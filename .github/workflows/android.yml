name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Decode signing keystore (stable signature → no data loss on update)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ishraq.keystore"
            echo "ISHRAQ_KEYSTORE_FILE=$RUNNER_TEMP/ishraq.keystore" >> "$GITHUB_ENV"
            echo "ISHRAQ_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ISHRAQ_KEY_ALIAS=ishraq" >> "$GITHUB_ENV"
            echo "✅ توقيع إشراق الثابت مُفعّل."
          else
            echo "ℹ️ لا يوجد سرّ توقيع — يُستخدم توقيع debug الافتراضي."
          fi

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/Ishraq.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ishraq-apk
          path: dist/Ishraq.apk
          if-no-files-found: error

      - name: Publish to Release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: إشراق — أحدث نسخة
          body: |
            ملف التثبيت المباشر لتطبيق "إشراق" ☀.
            حمّل Ishraq.apk وثبّته على هاتفك (فعّل "تثبيت من مصادر غير معروفة").
          files: dist/Ishraq.apk
          make_latest: "true"
