name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/MySystemLife.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MySystemLife-apk
          path: dist/MySystemLife.apk
          if-no-files-found: error

      - name: Publish to Release (direct download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: نظام حياتي — أحدث نسخة
          body: |
            ملف التثبيت المباشر لتطبيق "نظام حياتي".
            حمّل MySystemLife.apk وثبّته على هاتفك (فعّل "تثبيت من مصادر غير معروفة").
          files: dist/MySystemLife.apk
          make_latest: "true"
